<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <title>Jev — Run Jev on a CSV</title>
    <meta name="description" content="Bring a dataset. Ask a question. See Jev classify every row." />
    <meta property="og:title" content="Run Jev on a CSV." />
    <meta property="og:description" content="Bring a dataset. Ask a question. See Jev classify every row." />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jev-theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : (systemDark ? 'dark' : 'light')
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored)
          else root.removeAttribute('data-theme')
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
